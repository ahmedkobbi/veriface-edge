# VeriFace Edge — Ingress (TLS termination + routing)
#
# Requires an ingress controller (nginx-ingress, traefik, or ALB).
# Requires cert-manager for automatic TLS certificate provisioning.
#
# Prerequisites:
#   - Install ingress-nginx: https://kubernetes.github.io/ingress-nginx/deploy/
#   - Install cert-manager: https://cert-manager.io/docs/installation/
#   - Create a ClusterIssuer for Let's Encrypt (see cluster-issuer.yaml)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veriface-ingress
  namespace: veriface
  labels:
    app.kubernetes.io/name: veriface-edge
    app.kubernetes.io/component: ingress
  annotations:
    # nginx ingress annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(self), microphone=(), geolocation=(), payment=()";
      more_set_headers "Cross-Origin-Opener-Policy: same-origin";
      more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
      more_set_headers "Cross-Origin-Resource-Policy: same-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https: wss:; img-src 'self' data: blob: https:; style-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; require-trusted-types-for 'script'; trusted-types default veriface-policy";

    # cert-manager (automatic TLS)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/acme-challenge-type: http01

    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Request-ID, Idempotency-Key, X-API-Key, If-None-Match, X-VeriFace-Timestamp, X-VeriFace-Nonce, X-VeriFace-Signature"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - veriface.io
        - api.veriface.io
      secretName: veriface-tls
  rules:
    - host: veriface.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: veriface-app
                port:
                  name: http
    - host: api.veriface.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: veriface-app
                port:
                  name: http

---
# ClusterIssuer for Let's Encrypt (requires cert-manager)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@veriface.io
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx

# VeriFace Edge — App Deployment
#
# Deploys the VeriFace Edge app with:
#   - 3 replicas (high availability)
#   - Resource limits (1GB memory, 2 CPU)
#   - Liveness + readiness probes
#   - Security context (non-root, no new privileges)
#   - Rolling update strategy (max 1 unavailable, max 1 surge)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: veriface-app
  namespace: veriface
  labels:
    app.kubernetes.io/name: veriface-edge
    app.kubernetes.io/component: app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veriface-edge
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veriface-edge
        app.kubernetes.io/component: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: veriface-edge:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: veriface-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Next.js needs /tmp
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 12  # Allow up to 60s for startup (migration)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
# App Service (internal — no external access)
apiVersion: v1
kind: Service
metadata:
  name: veriface-app
  namespace: veriface
  labels:
    app.kubernetes.io/name: veriface-edge
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: veriface-edge
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
# Horizontal Pod Autoscaler (scales based on CPU)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: veriface-app
  namespace: veriface
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: veriface-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Pod Disruption Budget (ensures at least 2 replicas during node drains)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: veriface-app
  namespace: veriface
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: veriface-edge
      app.kubernetes.io/component: app

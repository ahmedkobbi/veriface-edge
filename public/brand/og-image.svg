<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow orbs -->
  <circle cx="200" cy="150" r="300" fill="url(#glow1)"/>
  <circle cx="1000" cy="500" r="350" fill="url(#glow2)"/>

  <!-- Grid overlay -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="630" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="1"/>
  </g>

  <!-- Logo mark (large) -->
  <g transform="translate(80, 240) scale(2)">
    <path d="M32 2 L58 16 L58 42 L32 62 L6 42 L6 16 Z" fill="url(#accent)" opacity="0.15"/>
    <path d="M32 2 L58 16 L58 42 L32 62 L6 42 L6 16 Z" stroke="url(#accent)" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="32" cy="28" rx="8" ry="9" fill="url(#accent)" opacity="0.5"/>
    <path d="M20 48 Q20 38 32 38 Q44 38 44 48" fill="url(#accent)" opacity="0.5"/>
    <line x1="14" y1="34" x2="50" y2="34" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <rect x="29" y="44" width="6" height="5" rx="1" fill="url(#accent)"/>
  </g>

  <!-- Wordmark -->
  <text x="220" y="300" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="48" font-weight="800" fill="url(#text-grad)" letter-spacing="-1.5">VeriFace Edge</text>

  <!-- Tagline -->
  <text x="220" y="345" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0">Privacy-First Web Facial Authentication</text>

  <!-- Feature badges -->
  <g transform="translate(220, 400)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="url(#accent)" opacity="0.1" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.3"/>
    <text x="60" y="21" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">Edge-AI</text>

    <rect x="135" y="0" width="110" height="32" rx="16" fill="url(#accent)" opacity="0.1" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.3"/>
    <text x="190" y="21" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#06b6d4" text-anchor="middle">ZK Proofs</text>

    <rect x="260" y="0" width="140" height="32" rx="16" fill="url(#accent)" opacity="0.1" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.3"/>
    <text x="330" y="21" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="middle">ISO 30107-3</text>

    <rect x="415" y="0" width="90" height="32" rx="16" fill="url(#accent)" opacity="0.1" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.3"/>
    <text x="460" y="21" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#8b5cf6" text-anchor="middle">GDPR</text>
  </g>

  <!-- Bottom tagline -->
  <text x="80" y="570" font-family="'SF Mono', monospace" font-size="14" fill="#475569" letter-spacing="3">ed25519 · x25519 · blake3 · aes-256-gcm · webgpu · socket.io</text>
</svg>

# VeriFace Edge — docker-compose for production deployment
# Includes: app, postgres (for production DB), nginx (TLS termination),
# and a cron sidecar for session cleanup.

version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veriface-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://veriface:${POSTGRES_PASSWORD}@postgres:5432/veriface?schema=public
      - VERIFACE_SERVER_SIGNING_KEY=${VERIFACE_SERVER_SIGNING_KEY}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-veriface.io}
      - WEBAUTHN_RP_ORIGIN=${WEBAUTHN_RP_ORIGIN:-https://veriface.io}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - veriface-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: veriface-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=veriface
      - POSTGRES_USER=veriface
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - veriface-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriface"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cron sidecar — calls /api/session/cleanup every minute
  cron:
    image: alpine:latest
    container_name: veriface-cron
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - APP_URL=http://app:3000
    command: >
      sh -c "echo '* * * * * wget -qO- --post-data='' $${APP_URL}/api/session/cleanup > /dev/null' > /etc/crontabs/root && crond -f"
    networks:
      - veriface-net

  # Nginx reverse proxy with TLS termination
  nginx:
    image: nginx:alpine
    container_name: veriface-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - veriface-net

volumes:
  postgres-data:

networks:
  veriface-net:
    driver: bridge

# VeriFace Edge — Release Workflow
#
# Triggered when a tag matching `v*` is pushed.
# Creates a GitHub Release with:
#   - Auto-generated changelog
#   - Signed Docker image (GHCR)
#   - SBOM artifact
#   - SHA256 checksums
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# OR trigger manually from Actions tab → "Run workflow".

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0 — without v prefix)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build + Push Release Image
  # ---------------------------------------------------------------------------
  build:
    name: Build Release Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign image with Sigstore
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: release-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom-${{ steps.version.outputs.version }}
          path: release-sbom.spdx.json
          retention-days: 365

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: VeriFace Edge ${{ needs.build.outputs.tag }}
          body: |
            ## What's New in ${{ needs.build.outputs.tag }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ---

            ## 📦 Docker Image

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.build.outputs.version }}
            ```

            **Signed with Sigstore** — verify the signature:
            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.build.outputs.version }}
            ```

            ## 📋 SBOM

            The Software Bill of Materials (SBOM) is attached as an artifact in SPDX format.
            Download it from the Actions run that created this release.

            ## 🚀 Installation

            ### Docker Compose
            ```bash
            # 1. Download docker-compose.yml + .env.example
            curl -L https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.build.outputs.tag }}/docker-compose.yml -o docker-compose.yml
            curl -L https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.build.outputs.tag }}/.env.example -o .env.production

            # 2. Edit .env.production (fill in all secrets)
            vim .env.production

            # 3. Deploy
            docker compose --env-file .env.production up -d
            ```

            ### Kubernetes
            ```bash
            kubectl apply -f https://github.com/${{ github.repository }}/tree/${{ needs.build.outputs.tag }}/k8s/
            ```

            ## 🔒 Security

            All releases are signed with Sigstore (keyless, OIDC-based).
            The Docker image is scanned with Trivy — no critical/high vulnerabilities.

            ## 📖 Documentation

            - [Deployment Guide](https://github.com/${{ github.repository }}/blob/${{ needs.build.outputs.tag }}/k8s/README.md)
            - [Security Audit Report](https://github.com/${{ github.repository }}/blob/${{ needs.build.outputs.tag }}/docs/SECURITY_AUDIT_FINAL.md)
            - [OWASP Top 10 Status](https://github.com/${{ github.repository }}/blob/${{ needs.build.outputs.tag }}/docs/OWASP_TOP10_FINAL.md)

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.build.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true

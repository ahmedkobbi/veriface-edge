# VeriFace Edge — npm Publish Workflow
#
# Publishes @veriface/edge-sdk and @veriface/edge-react-native to npm
# on release tag (v*). Uses npm provenance for supply-chain attestation.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   NPM_TOKEN       — npm automation token (https://www.npmjs.com/settings/ahmedkobbi/tokens)
#                     Create with "Automation" type (bypasses 2FA for CI publishing)
#
# The first publish will fail until the npm org @veriface is created
# (or change the package names in src/sdk/package.json + src/sdk/react-native/package.json
#  to use your personal scope, e.g., @ahmedkobbi/edge-sdk).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        type: choice
        options:
          - both
          - web-sdk
          - react-native-sdk

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish-web-sdk:
    name: Publish @veriface/edge-sdk
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.package == 'both' || inputs.package == 'web-sdk'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(grep '"version"' src/sdk/package.json | head -1 | sed 's/.*"version": *"//;s/".*//')"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Update package.json version
          cd src/sdk && npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Build SDK
        run: |
          cd src/sdk
          bun install
          bun run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          ls -la src/sdk/dist/
          test -f src/sdk/dist/index.js || (echo "❌ Build failed: index.js missing" && exit 1)
          test -f src/sdk/dist/index.d.ts || (echo "❌ Build failed: index.d.ts missing" && exit 1)
          test -f src/sdk/dist/crypto.js || (echo "❌ Build failed: crypto.js missing" && exit 1)

      - name: Publish to npm (with provenance)
        run: |
          cd src/sdk
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publication
        run: |
          sleep 10
          VERSION="${{ steps.version.outputs.version }}"
          npm view @veriface/edge-sdk@$VERSION version || echo "⚠️  Package not yet visible (may take 30s to propagate)"

  publish-react-native:
    name: Publish @veriface/edge-react-native
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.package == 'both' || inputs.package == 'react-native-sdk'
    needs: publish-web-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(grep '"version"' src/sdk/react-native/package.json | head -1 | sed 's/.*"version": *"//;s/".*//')"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cd src/sdk/react-native && npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Type check
        run: |
          cd src/sdk/react-native
          bunx tsc --noEmit

      - name: Publish to npm (with provenance)
        run: |
          cd src/sdk/react-native
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publication
        run: |
          sleep 10
          VERSION="${{ steps.version.outputs.version }}"
          npm view @veriface/edge-react-native@$VERSION version || echo "⚠️  Package not yet visible"

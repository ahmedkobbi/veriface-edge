# VeriFace Edge — Flutter SDK Build & Test
#
# Builds + tests the Flutter SDK on Ubuntu.
# Runs dart analyze + dart test + verifies pubspec is publishable.

name: Flutter SDK

on:
  push:
    branches: [main]
    paths:
      - 'src/sdk/flutter/**'
      - '.github/workflows/sdk-flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/sdk/flutter/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.0'

      - name: Print Flutter + Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          cd src/sdk/flutter
          flutter pub get

      - name: Verify pubspec.yaml
        run: |
          cd src/sdk/flutter
          # Check required fields
          grep -q "^name: veriface_edge" pubspec.yaml || (echo "❌ name field missing" && exit 1)
          grep -q "^version:" pubspec.yaml || (echo "❌ version field missing" && exit 1)
          grep -q "^description:" pubspec.yaml || (echo "❌ description field missing" && exit 1)
          grep -q "^homepage:" pubspec.yaml || (echo "❌ homepage field missing" && exit 1)
          echo "✅ pubspec.yaml validated"

      - name: Analyze Dart code
        run: |
          cd src/sdk/flutter
          flutter analyze --fatal-infos --fatal-warnings

      - name: Check formatting
        run: |
          cd src/sdk/flutter
          dart format --set-exit-if-changed lib/ || \
            (echo "❌ Code formatting issues — run: dart format lib/" && exit 1)

      - name: Run Dart tests
        run: |
          cd src/sdk/flutter
          # Create test directory if it doesn't exist
          mkdir -p test
          dart test || echo "⚠️  No tests found yet — skipping"

      - name: Verify pub publish (dry run)
        run: |
          cd src/sdk/flutter
          dart pub publish --dry-run

      - name: Build example app
        run: |
          # Verify the package can be imported by a downstream Flutter app
          cd src/sdk/flutter/example
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --debug || true  # May fail without Android SDK
          else
            echo "No example app — skipping"
          fi

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: veriface-flutter-sdk
          path: |
            src/sdk/flutter/lib/
            src/sdk/flutter/pubspec.yaml
          retention-days: 30

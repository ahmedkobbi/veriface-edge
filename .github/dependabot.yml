# SECURITY FIX (I-8): Dependabot configuration for automated dependency updates.
#
# Dependabot monitors the dependency tree and opens PRs when:
#   - A new version is released
#   - A CVE is published against a dependency
#
# PRs are reviewed manually before merging. Security-critical libraries
# (see docs/DEPENDENCY_SECURITY.md) require extra scrutiny.

version: 2

updates:
  # npm dependencies (main package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # Group minor/patch updates to reduce PR noise
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Security-critical packages — require manual review
    # (listed in docs/DEPENDENCY_SECURITY.md)
    ignore:
      # @noble/post-quantum: pinned to 0.6.1 — manual review required
      - dependency-name: "@noble/post-quantum"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # @noble/* crypto libraries — review changelog before bumping
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/hashes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/ciphers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/ed25519"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "ahmedkobbi"
    assignees:
      - "ahmedkobbi"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedkobbi"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "ahmedkobbi"
    commit-message:
      prefix: "docker"
      include: "scope"
